name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: cargo build --release

      - run: ./target/release/splash-monitor --json > sensor-output.json

      - run: |
          python3 -c 'import json; d=json.load(open("sensor-output.json")); assert set(d) >= {"cpu_active_ratio","cpu_core_ratios","cpu_core_temps","gpu_active_ratio","gpu_temp_avg","swap_used_bytes","free_percent"}'

      - run: ./target/release/splash-monitor --once --no-sensors --url http://127.0.0.1:1 | grep -q 'OFFLINE'
