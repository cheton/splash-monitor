[package]
name = "splash-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Terminal performance monitor for Splash inference on macOS"
repository = "https://github.com/cheton/splash-monitor"
keywords = ["splash", "monitor", "macos", "telemetry", "terminal"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["/previews", "/scripts", "/tmp", "/.github", "/.agents"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.1"

[lib]
name = "splash_monitor"
path = "src/lib.rs"

[[bin]]
name = "splash-monitor"
path = "src/main.rs"
